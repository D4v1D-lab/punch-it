// ---------------------------------------------------------------------------
// Verificación del entorno (JDK)
// Gradle 6.7.1 solo corre en JDK 8-15. Falla temprano, con un mensaje útil,
// en vez de un error críptico.
// ---------------------------------------------------------------------------
def javaMajor = JavaVersion.current().majorVersion.toInteger()

if (javaMajor < 8 || javaMajor > 15) {
    throw new GradleException("""
        Java ${javaMajor} detectado (${System.getProperty('java.version')}).
        Punch It necesita JDK 11 (Temurin recomendado); el rango soportado es 8-15.

        Gradle 6.7.1 no funciona con Java 16 o superior.
    """.stripIndent())
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "PunchIt"
        gdxVersion = '1.10.0'
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    }
}
